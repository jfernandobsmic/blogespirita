{% extends 'bbase.html' %}
{% load static %}
{% block content %}
    <br>
    <br>
    <br>
    <br>
    <section id="features" class="section-features">
          <div class="container">
              <div class="row">
                  <div class="col-lg-12 text-center">
                      <div class="section-title">
                          <h2>Materia sobre o tema - {{tema}}</h2>
                      </div>
                  </div>
              </div>
              <div class="row row-gutter">
                  {% for materia in materias %}
                      <div class="col-md-12 col-gutter">
                          <div class="featured-item">
                              <div class="featured-icon"><i class="fa fa-newspaper-o"></i></div>
                              <div class="featured-text">
                                  <h3 style="font-size: 2.3rem; font-family: 'Roboto'">{{ materia.materia }}</h3>
                                  <p class="text-justify" style="font-size: 2rem; line-height: 1.5;
                                    margin-bottom: 20px; font-family: 'Roboto">{{ materia.conteudo|linebreaksbr }}</p>
                                  <h4 class="text-right">{{materia.autor}}</h4>
                              </div>
                          </div>
                          <br>
                          <br>
                      </div>
                  {% endfor %}

              </div>
          </div>
      </section>
{% endblock %}
